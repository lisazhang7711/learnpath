<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习路径 demo</title>
<style>
  :root{
    --bg:#faf9f7; --card:#fff; --line:#e6e3dd; --line2:#d3d1c7;
    --tx:#2c2c2a; --tx2:#5f5e5a; --tx3:#888780;
    --video:#185fa5; --videoBg:#e6f1fb;
    --book:#3b6d11; --bookBg:#eaf3de;
    --art:#854f0b; --artBg:#faeeda;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:780px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:19px;font-weight:500;margin:0 0 4px}
  .sub{font-size:13px;color:var(--tx2);margin:0 0 22px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tabs button{padding:8px 14px;font-size:13px;border:1px solid var(--line2);
    border-radius:8px;background:#fff;color:var(--tx2);cursor:pointer}
  .tabs button.on{background:var(--tx);border-color:var(--tx);color:#fff}
  .tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tabs2 button{padding:6px 12px;font-size:12.5px;border:1px solid var(--line2);
    border-radius:20px;background:#fff;color:var(--tx2);cursor:pointer}
  .tabs2 button.on{background:#f0eee9;border-color:var(--tx2);color:var(--tx);font-weight:500}
  .glabel{font-size:12px;color:var(--tx3);margin:0 0 6px}
  .caveat{margin-top:10px;padding:9px 12px;background:#fff8e6;border:1px solid #f0d69a;
    border-radius:8px;font-size:12.5px;color:#7a5510;line-height:1.6}
  .srcbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--tx2)}
  .chip.bad{background:#fcebeb;border-color:#f09595;color:#791f1f}
  .total{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px;
    font-size:13px;color:var(--tx2)}
  .total b{font-size:16px;font-weight:500;color:var(--tx)}
  ol{list-style:none;margin:0;padding:0}
  li.step{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
  .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--bg);
    border:1px solid var(--line2);color:var(--tx2);font-size:12px;
    display:flex;align-items:center;justify-content:center;margin-top:2px}
  .body{flex:1;min-width:0}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;margin-right:8px}
  .tag.video{background:var(--videoBg);color:var(--video)}
  .tag.book{background:var(--bookBg);color:var(--book)}
  .tag.article{background:var(--artBg);color:var(--art)}
  .mins{font-size:12px;color:var(--tx2);float:right}
  .title{font-weight:500;font-size:14px;margin:6px 0 3px;line-height:1.45}
  .title a{color:var(--tx);text-decoration:none;border-bottom:1px solid var(--line2)}
  .title a:hover{border-color:var(--tx)}
  .range{font-size:13px;color:var(--tx2)}
  .why{font-size:12px;color:var(--tx3);margin-top:5px}
  .empty{padding:30px 0;text-align:center;color:var(--tx3);font-size:13px}
  /* 角色定位 */
  .role{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;margin-right:6px}
  .role.orient{background:#faeeda;color:#854f0b}
  .role.system{background:#eaf3de;color:#3b6d11}
  .role.practice{background:#e6f1fb;color:#185fa5}
  .role.deepen{background:#eee8fa;color:#5f3fa8}
  .role.pitfall{background:#fcebeb;color:#a32d2d}
  .ov{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:14px}
  .ov h2{font-size:13px;font-weight:500;margin:0 0 10px;color:var(--tx)}
  .toc{list-style:none;margin:0;padding:0}
  .toc li{display:flex;gap:10px;align-items:baseline;padding:5px 0;
    border-top:1px dashed var(--line);font-size:13px}
  .toc li:first-child{border-top:0}
  .toc .n{color:var(--tx3);font-size:12px;flex:0 0 18px}
  .toc .t{flex:1;min-width:0;color:var(--tx2)}
  .toc .m{color:var(--tx3);font-size:12px;flex:0 0 auto}
  .logic{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--tx2);line-height:1.7}
  .logic b{font-weight:500;color:var(--tx)}
  .goal{margin-top:6px;font-size:12.5px;color:var(--tx2);line-height:1.6}
  .goal em{font-style:normal;color:var(--tx)}
  .ev{font-size:11.5px;color:var(--tx3);margin-top:4px}
  .foot{margin-top:28px;font-size:12px;color:var(--tx3);line-height:1.7;
    border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>学习路径 demo</h1>
  <p class="sub">数据是真实调用 B站、知乎、微信读书三个接口跑出来的，不是假数据。选主题和时长，再选你的水平和目的——水平换的是内容本身（B站按不同词重搜），目的换的是这些内容怎么排。</p>
  <input type="text" id="q" placeholder="筛选主题…（试试「数学」「英语」「设计」）" style="width:100%;max-width:340px;padding:8px 12px;font-size:13px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--tx);margin-bottom:10px">
  <div class="tabs" id="tabs"></div>
  <p class="glabel">你现在是什么水平（换档会重新去 B站 搜一批不同的视频）</p>
  <div class="tabs2" id="levels"></div>
  <p class="glabel">你想通过这次学习达成什么</p>
  <div class="tabs2" id="goals"></div>
  <div id="srcbar" class="srcbar"></div>
  <div id="out"></div>
  <div class="foot" id="foot"></div>
</div>

const KIND = {video:['视频','video'], book:['书籍','book'], article:['文章','article']};
let idx = (DATA[0]||{}).__i ?? 0, goal = 'balanced', level = 'zero';
DATA.forEach((d,i) => d.__i = i);

// 目录页点进来会带 ?topic=xxx，直接定位到那个主题
const _qt = new URLSearchParams(location.search).get('topic');
if(_qt){
  const _m = DATA.findIndex(d => d.topic === _qt);
  if(_m >= 0) idx = _m;
}

// 主题多了以后不能再把全部数据内联进 HTML（30 个主题会到 2MB）。
// DATA 里只放索引，点哪个主题再拉它自己的 JSON——单次约 60KB。
function load(){
  const d = DATA[idx];
  if(!d) return;
  // 把当前主题写进地址栏，方便直接把某条路径的链接发给别人
  if(history.replaceState) history.replaceState(null, '', '?topic=' + encodeURIComponent(d.topic));
  if(d.by_level){ render(); return; }
  document.getElementById('out').innerHTML = '<div class="empty">加载中…</div>';
  document.getElementById('srcbar').innerHTML = '';
  fetch(d.file).then(r => r.json()).then(j => { d.by_level = j.by_level; render(); })
    .catch(e => { document.getElementById('out').innerHTML =
      '<div class="empty">这个主题的数据没加载出来：' + esc(e) + '</div>'; });
}

function renderTabs(){
  const k = (document.getElementById('q').value || '').trim().toLowerCase();
  const list = DATA.filter(d => !k || (d.topic + ' ' + (d.kw||'')).toLowerCase().includes(k));
  document.getElementById('tabs').innerHTML = list.length
    ? list.map(d => `<button data-i="${d.__i}" class="${d.__i===idx?'on':''}">${esc(d.topic)} · ${d.hours} 小时</button>`).join('')
    : '<span class="chip">没有匹配的主题</span>';
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); idx = +b.dataset.i; load();
  });
}
document.getElementById('q').oninput = renderTabs;
renderTabs();

const GOALS = DATA[0].goal_list;
const LEVELS = DATA[0].level_list;
document.getElementById('goals').innerHTML = GOALS.map(g =>
  `<button data-g="${g.key}" class="${g.key===goal?'on':''}" title="${esc(g.desc)}">${esc(g.label)}</button>`).join('');
document.querySelectorAll('#goals button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#goals button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); goal = b.dataset.g; render();
});

document.getElementById('levels').innerHTML = LEVELS.map(g =>
  `<button data-l="${g.key}" class="${g.key===level?'on':''}" title="${esc(g.desc)}">${esc(g.label)}</button>`).join('');
document.querySelectorAll('#levels button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#levels button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); level = b.dataset.l; render();
});

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function render(){
  const d = (DATA[idx].by_level || {})[level] || {};
  const names = {bilibili:'B站', zhihu:'知乎', weread:'微信读书'};
  document.getElementById('srcbar').innerHTML = Object.keys(names).map(k => {
    const s = (d.sources||{})[k] || {};
    if(!s.ok) return `<span class="chip bad">${names[k]} 不可用</span>`;
    const q = s.query ? `<span style="color:var(--tx3)"> 搜「${esc(s.query)}」</span>` : '';
    const r = s.reused ? '<span style="color:var(--tx3)"> 复用</span>' : '';
    return `<span class="chip">${names[k]} ${s.count} 条${q}${r}</span>`;
  }).join('');

  const p = (d.plans || {})[goal] || {};
  let h = '';
  if(!p.steps || !p.steps.length){
    h = '<div class="empty">没排出路径</div>';
  } else {
    const gm = GOALS.find(g => g.key === goal) || {};
    const lm = LEVELS.find(g => g.key === level) || {};
    // 填充率偶尔 >100%：末尾那一步按整章/整集保留（切一半没法看），
    // 所以会略微超出预算。不说明的话看起来像算错了。
    const over = Math.round(p.total_minutes - p.budget_minutes);
    const overTxt = over > 1 ? `<span style="color:var(--tx3)"> · 超 ${over}′（末尾按整章/整集保留）</span>` : '';
    h += `<div class="total"><span>水平：<b style="font-size:13px">${esc(lm.label||level)}</b> · 目标：<b style="font-size:13px">${esc(gm.label||goal)}</b> · 共 ${p.steps.length} 步</span>
      <span><b>${Math.round(p.total_minutes)}</b> / ${Math.round(p.budget_minutes)} 分钟${overTxt}</span></div>`;

    // 目录：先给每步的定位，再看细节
    const nv = p.narrative || {};
    h += '<div class="ov"><h2>这条路径怎么走 · 每步负责什么</h2><ul class="toc">'
      + p.steps.map((s,i) => `<li><span class="n">${i+1}</span>`
        + `<span class="role ${s.role}">${s.role_label}</span>`
        + `<span class="t">${esc(s.role_goal)}</span>`
        + `<span class="m">${Math.round(s.minutes)} 分钟</span></li>`).join('')
      + '</ul>';
    if(nv.chain){
      h += `<div class="logic"><b>顺序：</b>${esc(nv.chain)}</div>`;
    }
    if(nv.logic){
      h += `<div class="logic"><b>为什么这么排：</b>${esc(nv.logic)}</div>`;
    }
    if(nv.caveat){
      h += `<div class="caveat">${esc(nv.caveat)}</div>`;
    }
    h += '</div>';

    h += '<ol>' + p.steps.map((s,i) => {
      const [label,cls] = KIND[s.kind] || [s.kind,'article'];
      const link = s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title);
      return `<li class="step"><div class="num">${i+1}</div><div class="body">
        <span class="tag ${cls}">${label}</span>
        <span class="role ${s.role}">${s.role_label} · ${s.role_act}</span>
        <span class="mins">${Math.round(s.minutes)} 分钟 · 分 ${s.score}</span>
        <div class="title">${link}</div>
        <div class="range">${esc(s.range)}</div>
        <div class="goal">这一步解决什么：<em>${esc(s.role_goal)}</em></div>
        <div class="why">${esc(s.why)}</div>
        <div class="ev">定位依据：${esc(s.role_evidence)}</div>
      </div></li>`;
    }).join('') + '</ol>';
  }
  document.getElementById('out').innerHTML = h;
  // 注：上一版这里写成了 `+ + '排什么顺序...'`，一元 + 把字符串转成数字，
  // 页脚会直接印出 NaN。拼接时不能留空操作数。
  document.getElementById('foot').innerHTML =
    '选什么看综合分 = 0.6 × 该源内热度百分位 + 0.4 × 质量分（三源热度量级差 6 个数量级，'
    + '先在各自源内算百分位再统一，不做跨源硬比）。<br>'
    + '<b>水平</b>决定取什么内容：' + LEVELS.map(g => `<b>${esc(g.label)}</b>＝${esc(g.desc)}`).join('；')
    + '——换档会按不同关键词重新去 B站 搜一批视频，并剔掉不合档的书和文章。<br>'
    + '<b>目标</b>决定排什么顺序、每类占多少时间：'
    + GOALS.map(g => `<b>${esc(g.label)}</b>＝${esc(g.desc)}`).join('；')
    + '。<br>角色由标题关键词判定，没命中时按载体兜底（视频→动手 / 书→体系 / 文章→定向）。';
}
load();
</script>
</body>
</html>
