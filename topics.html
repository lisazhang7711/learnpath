const CATS = ["编程 · AI", "数学 · 理科", "语言 · 考试", "设计 · 创作", "音乐 · 艺术", "生活 · 健康", "职场 · 商业", "工程 · 硬件", "人文 · 社科"];
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  const k = (document.getElementById('q').value||'').trim().toLowerCase();
  const hit = DATA.filter(d => !k || (d.topic+' '+(d.kw||'')+' '+d.cat).toLowerCase().includes(k));
  document.getElementById('hint').textContent = k ? ('匹配 '+hit.length+' 个') : ('共 '+DATA.length+' 个主题');
  if(!hit.length){ document.getElementById('list').innerHTML =
    '<div class="empty">没有匹配的主题。</div>'; return; }
  document.getElementById('list').innerHTML = CATS.map(c => {
    const items = hit.filter(d => d.cat === c);
    if(!items.length) return '';
    return '<div class="cat"><h2>'+esc(c)+'<span>'+items.length+'</span></h2><div class="grid">'
      + items.map(d => {
          let tg = '<em class="on">'+d.v+' 视频</em>';
          if(d.b) tg += '<em class="on">'+d.b+' 书</em>';
          if(d.a) tg += '<em class="on">'+d.a+' 文</em>';
          return '<a class="card" href="demo.html?topic='+encodeURIComponent(d.topic)+'">'
            + '<b>'+esc(d.topic)+'</b><i>默认 '+d.hours+' 小时</i>'
            + '<div class="tags">'+tg+'</div></a>';
        }).join('')
      + '</div></div>';
  }).join('');
}
document.getElementById('q').oninput = render;
render();
